# Each push to main builds Meow.app (Apple silicon + Intel) and publishes it
# twice: as release `commit-<short hash>`, kept, and as `latest`, replaced on
# every publish. Installed apps read latest/version.json to update themselves.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time, in push order, so `latest` ends on the newest commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      MEOW_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build
        run: scripts/bundle.sh --universal

      - name: Package
        run: scripts/package.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(printf '%s' "$MEOW_COMMIT" | cut -c1-7)
          subject=$(git log -1 --format=%s)
          notes="Built from ${MEOW_COMMIT}: ${subject}

          Install: open Meow.dmg and drag Meow to Applications. The app is not
          notarized, so the first time, right-click it and choose Open."

          gh release create "commit-$short" dist/* \
            --target "$MEOW_COMMIT" --title "Meow $short" --notes "$notes" --latest=false

          # `latest` is replaced as a whole: its tag moves to this commit.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --target "$MEOW_COMMIT" --title "Meow latest ($short)" --notes "$notes" --latest
