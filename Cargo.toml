[package]
name = "meow"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6"
emojis = "0.9.1"
global-hotkey = "0.9.0"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationSettings", "UNNotificationSound", "block2"] }
objc2-web-kit = "0.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
security-framework = "3.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ureq = "3.4.2"

[dev-dependencies]
png = "0.18.1"
